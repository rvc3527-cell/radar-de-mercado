name: Testes do Radar
on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes dos indicadores, motor e integração
        run: node --test tests/*.test.mjs
      - name: Validar sintaxe do coletor e gerar painel experimental
        run: |
          node --input-type=module --check < cloud-collector.js
          node --check indicators.js
          node --check statistics.js
          node scripts/build-preview.mjs
          git diff --check
