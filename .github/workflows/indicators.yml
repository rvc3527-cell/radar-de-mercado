name: Testes dos indicadores
on:
  push:
    branches:
      - feature/quality-v12
      - feature/engine-tests-v13
      - feature/shared-engine-v14
      - feature/integration-v15
  pull_request:
    paths:
      - 'tests/**'
      - 'index.html'
      - 'engine.js'
      - '.github/workflows/indicators.yml'
jobs:
  indicators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar equivalência EMA e RSI
        run: node --test tests/*.test.mjs
